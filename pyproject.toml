[project]
name = "commit-history-forensics"
version = "0.1.0"
description = "Detect fabricated git histories from structural signals: timestamp skew, uniformity, cadence."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
ui = ["streamlit>=1.40", "altair>=5", "pandas>=2.2"]

[dependency-groups]
# ruff pinned to a minor range: the formatter changes between minor versions, so an
# open bound means CI reformats differently from the committed code.
dev = ["pytest>=8", "ruff>=0.16,<0.17"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
